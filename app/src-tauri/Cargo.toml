[package]
name = "pixelfed-importer"
version = "1.0.0"
description = "Import an Instagram data export into Pixelfed"
license = "MIT"
edition = "2021"

[lib]
name = "pixelfed_importer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "multipart", "json", "form", "query", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.0", features = ["rt", "time", "net", "io-util", "macros", "sync"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
